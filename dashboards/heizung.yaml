title: Heizung
views:
  - title: Status
    path: status
    icon: mdi:view-dashboard
    cards:
      - type: markdown
        content: >-
          Zeiten und Temperaturen stehen unter **Einstellungen**.
          **Alle Ventile zu** schließt die Heizkörper (auch Waschraum) und den Heizkreis.
          Modus **Manuell** oder **Aus** stoppt die Automatik.
          **Away Haus/Büro** senkt aktive Sollwerte auf die Away-Absenkung (Auto = Presence).
          **Puffer** zeigt die Restwärme-Prognose; die ELWA bleibt bei openWB.
      - type: entities
        title: Steuerung
        entities:
          - input_select.heizung_modus
          - input_select.heizung_away
          - input_select.heizung_away_buero
          - input_boolean.heizung_klima_auto
          - input_boolean.heizung_tado_auto
          - input_boolean.heizung_ventile_zu
          - input_boolean.heizung_eta_auto
          - input_boolean.heizung_feiertag
          - script.heizung_tick
      - type: entities
        title: Soll jetzt
        entities:
          - sensor.heizung_soll_wohnen
          - sensor.heizung_soll_buero
          - sensor.heizung_soll_schlafen_a
          - sensor.heizung_soll_schlafen_b
          - sensor.heizung_soll_schlafen_c
          - sensor.heizung_soll_bad
          - sensor.heizung_soll_spielzimmer
          - binary_sensor.heizung_away_aktiv
          - binary_sensor.heizung_away_buero_aktiv
          - binary_sensor.heizung_wochenende
          - binary_sensor.heizung_kalte_nacht_schlafen
          - binary_sensor.heizung_kalte_nacht_wohnen
          - binary_sensor.heizung_dwd_kalte_nacht
          - binary_sensor.heizung_hydraulisch_bedarf
          - binary_sensor.heizung_puffer_reicht
          - binary_sensor.heizung_restwaerme_reicht
          - sensor.heizung_puffer_prognose
      - type: entities
        title: Anlage
        entities:
          - sensor.heizkreis_eingange_aussentemperatur
          - sensor.heizung_dwd_nachttiefst
          - binary_sensor.heizung_dwd_kalte_nacht
          - binary_sensor.heizung_dwd_puffer_vorbereitung
          - sensor.pufferflex_eingange_fuhler_1_oben
          - sensor.pufferflex_eingange_fuhler_2
          - sensor.pufferflex_eingange_fuhler_3
          - sensor.heizung_puffer_energie_ww
          - sensor.heizung_puffer_energie_heizen
          - sensor.ac_elwa_2_1_temperatur_1
          - sensor.ac_elwa_2_1_power_elwa_2
          - switch.kessel_sonstiges_ein_aus_taste
          - switch.heizkreis_sonstiges_ein_aus_taste
          - sensor.eta_pellet_gesamtverbrauch
          - sensor.e3dc_battery_state_of_charge
          - sensor.solcast_pv_forecast_prognose_heute
          - sensor.e3dc_maestro_forecast_netzbezug_nachste_24h
      - type: markdown
        title: Einsparung Klima + ELWA vs. Pellets
        content: >-
          |  | kg | Brutto € | Stromkosten € | Netto € |
          |---|---:|---:|---:|---:|
          | **Heute** | {{ states('sensor.heizung_einsparung_gesamt_tag') }} |
          {{ state_attr('sensor.heizung_einsparung_gesamt_tag', 'pellet_wert_brutto_eur') }} |
          {{ state_attr('sensor.heizung_einsparung_gesamt_tag', 'stromkosten_eur') }} |
          {{ state_attr('sensor.heizung_einsparung_gesamt_tag', 'netto_ersparnis_eur') }} |
          | **Monat** | {{ states('sensor.heizung_einsparung_gesamt_monat') }} |
          {{ state_attr('sensor.heizung_einsparung_gesamt_monat', 'pellet_wert_brutto_eur') }} |
          {{ state_attr('sensor.heizung_einsparung_gesamt_monat', 'stromkosten_eur') }} |
          {{ state_attr('sensor.heizung_einsparung_gesamt_monat', 'netto_ersparnis_eur') }} |
          | **Jahr** | {{ states('sensor.heizung_einsparung_gesamt_jahr') }} |
          {{ state_attr('sensor.heizung_einsparung_gesamt_jahr', 'pellet_wert_brutto_eur') }} |
          {{ state_attr('sensor.heizung_einsparung_gesamt_jahr', 'stromkosten_eur') }} |
          {{ state_attr('sensor.heizung_einsparung_gesamt_jahr', 'netto_ersparnis_eur') }} |

          Davon Klima (heute/Monat/Jahr): {{ states('sensor.heizung_einsparung_klima_tag') }} /
          {{ states('sensor.heizung_einsparung_klima_monat') }} /
          {{ states('sensor.heizung_einsparung_klima_jahr') }} kg —
          ELWA: {{ states('sensor.heizung_einsparung_elwa_tag') }} /
          {{ states('sensor.heizung_einsparung_elwa_monat') }} /
          {{ states('sensor.heizung_einsparung_elwa_jahr') }} kg.

          PV/Akku/Netz heute (Klima): {{ state_attr('sensor.heizung_einsparung_klima_tag', 'pv_kwh') }} /
          {{ state_attr('sensor.heizung_einsparung_klima_tag', 'akku_kwh') }} /
          {{ state_attr('sensor.heizung_einsparung_klima_tag', 'netz_kwh') }} kWh.
          Klima-Wärme ist modelliert (Feld-COP-Kennlinie), ELWA-Wärme = ELWA-Strom.
      - type: entities
        title: Einsparung Details
        entities:
          - sensor.heizung_einsparung_gesamt_tag
          - sensor.heizung_einsparung_gesamt_monat
          - sensor.heizung_einsparung_gesamt_jahr
          - sensor.heizung_einsparung_klima_tag
          - sensor.heizung_einsparung_klima_monat
          - sensor.heizung_einsparung_klima_jahr
          - sensor.heizung_einsparung_elwa_tag
          - sensor.heizung_einsparung_elwa_monat
          - sensor.heizung_einsparung_elwa_jahr
          - binary_sensor.heizung_klima_heizbetrieb
          - sensor.heizung_stromquellen_anteil
          - input_number.heizung_einsparung_heat_per_kg
          - input_number.heizung_einsparung_einspeiseverguetung_ct
          - input_number.heizung_einsparung_netzpreis_ct
          - input_number.heizung_einsparung_feldabschlag
      - type: entities
        title: Fenster / Sperren
        entities:
          - binary_sensor.heizung_fenster_relevant_offen
          - binary_sensor.heizung_sperre_wohnen
          - binary_sensor.heizung_sperre_buero
          - binary_sensor.heizung_sperre_bad
          - binary_sensor.heizung_sperre_spielzimmer
          - binary_sensor.heizung_sperre_schlafen_b
          - binary_sensor.heizung_sperre_schlafen_c
          - timer.heizung_eta_mindestlauf
          - timer.heizung_eta_pause
      - type: glance
        title: Klima
        entities:
          - climate.wohnzimmer_2
          - climate.esszimmer
          - climate.faikin_mqtt_hvac
          - climate.schlafen_a
          - climate.schlafen_b
          - climate.schlafen_c
      - type: glance
        title: tado
        entities:
          - climate.wohnzimmer
          - climate.buro
          - climate.bad
          - climate.spielzimmer
          - climate.schlafzimmer
          - climate.schlafen_c_tado

  - title: Puffer
    path: puffer
    icon: mdi:water-boiler
    cards:
      - type: markdown
        content: >-
          {{ state_attr('sensor.heizung_puffer_prognose', 'hinweis') }}

          Ampel: **{{ states('sensor.heizung_puffer_prognose') }}**.
          WW-tauglich jetzt: {{ states('sensor.heizung_puffer_energie_ww') }} kWh.
          PV-Peak in den nächsten 24 h: **{{ state_attr('sensor.heizung_puffer_prognose', 'kurve').pv_kw | max }} kW**
          (Solcast morgen {{ states('sensor.solcast_pv_forecast_prognose_morgen') }} kWh).
          Heizstab bleibt bei openWB (kein HA-PWM).
      - type: custom:apexcharts-card
        graph_span: 24h
        span:
          start: minute
        now:
          show: true
        header:
          show: true
          title: Puffer oben / PV / Überschuss / SoC
          show_states: false
        apex_config:
          legend:
            position: bottom
          xaxis:
            type: datetime
        yaxis:
          - id: temp
            min: 25
            max: 85
            decimals: 0
            apex_config:
              title:
                text: °C
          - id: pwr
            opposite: true
            min: 0
            max: 12
            decimals: 1
            apex_config:
              title:
                text: kW
          - id: soc
            opposite: true
            min: 0
            max: 100
            decimals: 0
            show: false
        series:
          - entity: sensor.heizung_puffer_prognose
            name: Puffer oben ohne Stab
            yaxis_id: temp
            stroke_width: 2
            unit: "°C"
            show:
              legend_value: false
              extremas: false
            data_generator: |
              let k = entity.attributes.kurve;
              if (!k) return [];
              if (typeof k === 'string') k = JSON.parse(k);
              return (k.ts || []).map((t, i) => [t, k.top_ohne[i]]);
          - entity: sensor.heizung_puffer_prognose
            name: Puffer oben mit ELWA
            yaxis_id: temp
            stroke_width: 2
            unit: "°C"
            show:
              legend_value: false
            data_generator: |
              let k = entity.attributes.kurve;
              if (!k) return [];
              if (typeof k === 'string') k = JSON.parse(k);
              return (k.ts || []).map((t, i) => [t, k.top_mit[i]]);
          - entity: sensor.heizung_puffer_prognose
            name: PV Prognose
            yaxis_id: pwr
            type: area
            opacity: 0.15
            stroke_width: 1
            unit: kW
            show:
              legend_value: false
              extremas: max
            data_generator: |
              let k = entity.attributes.kurve;
              if (!k) return [];
              if (typeof k === 'string') k = JSON.parse(k);
              return (k.ts || []).map((t, i) => [t, k.pv_kw[i]]);
          - entity: sensor.heizung_puffer_prognose
            name: ELWA-Überschuss
            yaxis_id: pwr
            type: area
            opacity: 0.25
            stroke_width: 1
            unit: kW
            show:
              legend_value: false
              extremas: max
            data_generator: |
              let k = entity.attributes.kurve;
              if (!k) return [];
              if (typeof k === 'string') k = JSON.parse(k);
              return (k.ts || []).map((t, i) => [t, k.surplus_kw[i]]);
          - entity: sensor.heizung_puffer_prognose
            name: SoC Maestro
            yaxis_id: soc
            stroke_width: 2
            unit: "%"
            show:
              legend_value: false
            data_generator: |
              let k = entity.attributes.kurve;
              if (!k) return [];
              if (typeof k === 'string') k = JSON.parse(k);
              return (k.ts || []).map((t, i) => [t, k.soc[i]]);
      - type: custom:button-card
        entity: sensor.pufferflex_eingange_fuhler_1_oben
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: none
        triggers_update:
          - sensor.pufferflex_eingange_fuhler_1_oben
          - sensor.pufferflex_eingange_fuhler_2
          - sensor.pufferflex_eingange_fuhler_3
          - sensor.ac_elwa_2_1_power_elwa_2
          - sensor.ac_elwa_2_1_temperatur_1
          - sensor.elwa_api_leistung
          - sensor.elwa_api_temperatur_1
          - sensor.elwa_api_temperatur_2
          - sensor.elwa_api_zieltemperatur
          - sensor.elwa_api_aktiv
          - sensor.heizung_puffer_energie_ww
          - sensor.heizung_puffer_energie_heizen
          - sensor.heizung_puffer_prognose
          - input_number.heizung_elwa_ziel_c
        styles:
          card:
            - padding: 18px 18px 8px
            - background: linear-gradient(165deg, #1c1915 0%, #0c0b0a 58%, #14110e 100%)
            - border-radius: 22px
            - border: 1px solid rgba(201,149,92,0.22)
            - box-shadow: 0 18px 40px rgba(0,0,0,0.35)
          grid:
            - grid-template-areas: '"head" "viz"'
            - grid-template-rows: min-content 1fr
            - gap: 4px
          custom_fields:
            head:
              - justify-self: stretch
            viz:
              - justify-self: stretch
        extra_styles: |
          @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
          @keyframes elwa-glow {
            0%, 100% { filter: drop-shadow(0 0 3px #f4a261) drop-shadow(0 0 10px #e76f51); }
            50% { filter: drop-shadow(0 0 8px #ffd6a5) drop-shadow(0 0 18px #e76f51); }
          }
        custom_fields:
          head: |
            [[[
              const ww = states['sensor.heizung_puffer_energie_ww']?.state || '–';
              const hz = states['sensor.heizung_puffer_energie_heizen']?.state || '–';
              const amp = states['sensor.heizung_puffer_prognose']?.state || '–';
              return `<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-family:'IBM Plex Sans',sans-serif;color:#efe6d9;">
                <div>
                  <div style="font-family:Fraunces,serif;font-size:22px;letter-spacing:-0.02em;">Puffer 825 L</div>
                  <div style="opacity:.62;font-size:12px;margin-top:2px;">F1–F3 ETA · T2 am Stab · T1 zwischen Mitte und unten</div>
                </div>
                <div style="display:flex;gap:14px;font-size:12px;text-align:right;">
                  <div><div style="opacity:.5;">WW</div><div style="font-weight:600;">${ww} kWh</div></div>
                  <div><div style="opacity:.5;">Heizen</div><div style="font-weight:600;">${hz} kWh</div></div>
                  <div><div style="opacity:.5;">Ampel</div><div style="font-weight:600;text-transform:capitalize;">${amp}</div></div>
                </div>
              </div>`;
            ]]]
          viz: |
            [[[
              const n = (id, d=0) => { const v = parseFloat(states[id]?.state); return Number.isFinite(v) ? v : d; };
              const t1 = n('sensor.pufferflex_eingange_fuhler_1_oben');
              const t2 = n('sensor.pufferflex_eingange_fuhler_2');
              const t3 = n('sensor.pufferflex_eingange_fuhler_3');
              const te1 = n('sensor.elwa_api_temperatur_1', n('sensor.ac_elwa_2_1_temperatur_1'));
              const te2 = n('sensor.elwa_api_temperatur_2');
              const w = n('sensor.elwa_api_leistung', n('sensor.ac_elwa_2_1_power_elwa_2'));
              const ziel = n('sensor.elwa_api_zieltemperatur', n('input_number.heizung_elwa_ziel_c', 80));
              const on = w > 40;
              const col = (t) => {
                const u = Math.max(0, Math.min(1, (t - 22) / 58));
                const h = 208 - u * 200;
                const s = 42 + u * 38;
                const l = 22 + u * 24;
                return `hsl(${h} ${s}% ${l}%)`;
              };
              const glow = on ? 'elwa-glow' : 'none';
              const rod = on ? '#ffb703' : '#8a6a48';
              const coil = on ? '#fb8500' : '#6b5340';
              const fmt = (t) => Number.isFinite(t) ? t.toFixed(1).replace('.', ',') + ' °C' : '–';
              return `
              <svg viewBox="0 0 640 430" width="100%" xmlns="http://www.w3.org/2000/svg" style="font-family:'IBM Plex Sans',sans-serif;">
                <defs>
                  <linearGradient id="shell" x1="0" x2="1">
                    <stop offset="0" stop-color="#2a2622"/>
                    <stop offset=".45" stop-color="#3a342e"/>
                    <stop offset="1" stop-color="#1a1815"/>
                  </linearGradient>
                  <clipPath id="water"><rect x="178" y="58" width="168" height="314" rx="84"/></clipPath>
                  <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
                </defs>
                <text x="24" y="28" fill="#c9955c" font-size="11" letter-spacing="2.4">ETA PUFFERFLEX</text>
                <g opacity=".9">
                  <path d="M86 92 h70" stroke="#7a8b96" stroke-width="10" stroke-linecap="round"/>
                  <path d="M86 92 v-28 h-40" stroke="#7a8b96" stroke-width="8" fill="none" stroke-linecap="round"/>
                  <text x="24" y="52" fill="#9aa7b0" font-size="11">Vorlauf / WW</text>
                  <path d="M86 338 h70" stroke="#5c6a72" stroke-width="10" stroke-linecap="round"/>
                  <path d="M86 338 v28 h-40" stroke="#5c6a72" stroke-width="8" fill="none" stroke-linecap="round"/>
                  <text x="24" y="388" fill="#9aa7b0" font-size="11">Rücklauf</text>
                </g>
                <rect x="168" y="48" width="188" height="334" rx="94" fill="url(#shell)" stroke="#c9955c" stroke-width="1.4"/>
                <rect x="176" y="56" width="172" height="318" rx="86" fill="#0b0c0e"/>
                <g clip-path="url(#water)">
                  <rect x="178" y="58" width="168" height="105" fill="${col(t1)}"/>
                  <rect x="178" y="163" width="168" height="105" fill="${col(t2)}"/>
                  <rect x="178" y="268" width="168" height="104" fill="${col(t3)}"/>
                  <ellipse cx="262" cy="215" rx="70" ry="48" fill="${on ? '#ffb703' : col(t2)}" opacity="${on ? 0.28 : 0.12}"/>
                </g>
                <rect x="176" y="56" width="172" height="318" rx="86" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="2"/>
                <circle cx="168" cy="110" r="6" fill="#efe6d9" stroke="#c9955c"/>
                <circle cx="168" cy="215" r="6" fill="#efe6d9" stroke="#c9955c"/>
                <circle cx="168" cy="320" r="6" fill="#efe6d9" stroke="#c9955c"/>
                <g fill="#efe6d9">
                  <text x="86" y="106" font-size="12" fill="#c9955c">F1 oben</text>
                  <text x="86" y="124" font-size="20" font-weight="600">${fmt(t1)}</text>
                  <text x="86" y="211" font-size="12" fill="#c9955c">F2 mitte</text>
                  <text x="86" y="229" font-size="20" font-weight="600">${fmt(t2)}</text>
                  <text x="86" y="316" font-size="12" fill="#c9955c">F3 unten</text>
                  <text x="86" y="334" font-size="20" font-weight="600">${fmt(t3)}</text>
                </g>
                <g style="animation:${on ? 'elwa-glow 1.6s ease-in-out infinite' : 'none'};">
                  <rect x="246" y="206" width="96" height="16" rx="8" fill="${rod}"/>
                  <rect x="252" y="210" width="78" height="8" rx="4" fill="${coil}"/>
                  <rect x="340" y="207" width="92" height="14" rx="7" fill="${rod}"/>
                  <circle cx="340" cy="214" r="11" fill="${on ? '#ffd166' : '#5c4a3a'}" stroke="#c9955c"/>
                </g>
                <text x="380" y="188" fill="#c9955c" font-size="11" letter-spacing="1.6">HEIZSTAB · T2</text>
                <text x="380" y="216" fill="#efe6d9" font-size="18" font-weight="600">${fmt(te2)}</text>
                <text x="380" y="236" fill="${on ? '#ffb703' : '#8a8178'}" font-size="13">${on ? (w/1000).toFixed(2).replace('.', ',') + ' kW aktiv' : 'Standby · Ziel ' + ziel.toFixed(0) + ' °C'}</text>
                <circle cx="356" cy="268" r="6" fill="#efe6d9" stroke="#c9955c"/>
                <path d="M356 268 h24" stroke="#c9955c" stroke-width="1.2" opacity=".7"/>
                <text x="380" y="264" fill="#c9955c" font-size="11" letter-spacing="1.2">ELWA T1</text>
                <text x="380" y="286" fill="#efe6d9" font-size="18" font-weight="600">${fmt(te1)}</text>
                <text x="380" y="304" fill="#8a8178" font-size="11">zwischen Mitte und unten</text>
                <text x="168" y="404" fill="#8a8178" font-size="11">T2 ist der Stab · T1 sitzt eine Lage tiefer · ETA F1–F3 links</text>
              </svg>`;
            ]]]

