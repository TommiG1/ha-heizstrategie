  heizung_klima_idle_min:
    name: Klima aus nach Idle (min)
    min: 5
    max: 60
    step: 1
    unit_of_measurement: min
    mode: box
    icon: mdi:timer-sand
    initial: 20
  heizung_eta_puffer_min_c:
    name: ETA wenn Puffer oben unter °C
    min: 30
    max: 70
    step: 1
    unit_of_measurement: "°C"
    mode: slider
    icon: mdi:water-thermometer
    initial: 45
  heizung_eta_mindestlauf_min:
    name: ETA Mindestlauf (min)
    min: 30
    max: 240
    step: 15
    unit_of_measurement: min
    mode: box
    icon: mdi:timer
    initial: 90
  heizung_eta_pause_min:
