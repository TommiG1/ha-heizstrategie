            {% if ns.e1 < tmin and ns.mit is none %}{% set ns.mit = i * dt_h %}{% endif %}
            {% set ns.soc = ns.socn %}
          {% endfor %}
          {% set h_ohne = ns.ohne if ns.ohne is not none else 24 %}
          {% set h_mit = ns.mit if ns.mit is not none else 24 %}
          {% if h_ohne >= 18 %}reicht{% elif h_ohne >= 8 or h_mit >= 12 %}knapp{% else %}fehlt{% endif %}
        attributes:
          hinweis: >-
