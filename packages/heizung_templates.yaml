            {% set qe = (ww_kw + hyd_kw + 0.08) * dt_h * 1000.0 %}
            {% set de1 = [qe / cap, ns.e1 - 20] | min %}{% set ns.e1 = ns.e1 - de1 %}{% set qe = qe - de1 * cap %}
            {% set de2 = [qe / cap, ns.e2 - 20] | min %}{% set ns.e2 = ns.e2 - de2 %}{% set qe = qe - de2 * cap %}
            {% set de3 = [qe / cap, ns.e3 - 20] | min %}{% set ns.e3 = ns.e3 - de3 %}
