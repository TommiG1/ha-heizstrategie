    sensor:
      - name: Heizung DWD Nachttiefst
        unique_id: heizung_dwd_nachttiefst
        default_entity_id: sensor.heizung_dwd_nachttiefst
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:thermometer-chevron-down
        availability: "{{ states('weather.dwd_station') not in ['unknown', 'unavailable'] }}"
        state: >-
          {% set items = dwd_fc['weather.dwd_station'].get('forecast', []) if dwd_fc is mapping else [] %}
          {% if now() < today_at('08:00') %}
            {% set start = now() %}
            {% set end = today_at('08:00') %}
          {% else %}
            {% set start = today_at('18:00') %}
            {% set end = today_at('08:00') + timedelta(days=1) %}
            {% if now() > start %}
              {% set start = now() %}
            {% endif %}
          {% endif %}
          {% set ns = namespace(temps=[]) %}
          {% for item in items %}
            {% set t = as_datetime(item.datetime) %}
            {% if t is not none %}
              {% if t.tzinfo is none %}
                {% set t = t.replace(tzinfo=now().tzinfo) %}
              {% endif %}
              {% if t >= start and t <= end and item.temperature is number %}
                {% set ns.temps = ns.temps + [item.temperature] %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% if ns.temps %}{{ ns.temps | min }}{% endif %}
        attributes:
          fenster_start: "18:00"
          fenster_ende: "08:00"
