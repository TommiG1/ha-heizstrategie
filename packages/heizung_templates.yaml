    sensor:
      - name: Heizung Puffer Prognose
        unique_id: heizung_puffer_prognose
        default_entity_id: sensor.heizung_puffer_prognose
        icon: mdi:chart-timeline-variant
        availability: >-
          {{ is_number(states('sensor.pufferflex_eingange_fuhler_1_oben'))
             and is_number(states('sensor.pufferflex_eingange_fuhler_2'))
             and is_number(states('sensor.pufferflex_eingange_fuhler_3')) }}
        state: >-
          {% set tmin = states('input_number.heizung_eta_puffer_min_c') | float(45) %}
          {% set m = 825.0 / 3.0 %}
          {% set cp = 1.163 %}
          {% set dt_h = 0.5 %}
          {% set ww_tag = states('input_number.heizung_ww_liter_tag') | float(80) * cp * (tmin - 10.0) / 1000.0 %}
          {% set hk_kw = states('input_number.heizung_heizkreis_kw') | float(2) %}
          {% set haus_kw = [[states('sensor.e3dc_berechneter_hausverbrauch_wallbox_elwa') | float(1000) / 1000.0, 0.5] | max, 2.5] | min %}
          {% set ventile_zu = is_state('input_boolean.heizung_ventile_zu', 'on') %}
          {% set heiz_aus = states('input_select.heizung_modus') in ['Aus', 'Manuell'] %}
          {% set fc = (state_attr('sensor.solcast_pv_forecast_prognose_heute', 'detailedForecast') or [])
                    + (state_attr('sensor.solcast_pv_forecast_prognose_morgen', 'detailedForecast') or []) %}
          {% set pts = state_attr('sensor.e3dc_maestro_forecast_soc_trajektorie_24h', 'trajectory_points') or [] %}
          {% set ns = namespace(
            t1=states('sensor.pufferflex_eingange_fuhler_1_oben') | float(0),
            t2=states('sensor.pufferflex_eingange_fuhler_2') | float(0),
            t3=states('sensor.pufferflex_eingange_fuhler_3') | float(0),
            e1=states('sensor.pufferflex_eingange_fuhler_1_oben') | float(0),
            e2=states('sensor.pufferflex_eingange_fuhler_2') | float(0),
            e3=states('sensor.pufferflex_eingange_fuhler_3') | float(0),
            soc=states('sensor.e3dc_battery_state_of_charge') | float(0),
            pv=0.0, socn=0.0, ohne=none, mit=none) %}
          {% for i in range(48) %}
            {% set ts = now() + timedelta(minutes=i * 30) %}
            {% set n = ts.strftime('%H:%M:%S') %}
            {% set we = ts.isoweekday() >= 6 or is_state('input_boolean.heizung_feiertag', 'on') %}
            {% set ww_kw = (ww_tag * 0.7) / 3.0 if n >= '06:00:00' and n < '09:00:00' else ((ww_tag * 0.3) / 3.0 if n >= '18:00:00' and n < '21:00:00' else 0.0) %}
            {% if we %}
              {% set hyd = (n >= states('input_datetime.heizung_bad_we_start') and n < states('input_datetime.heizung_bad_we_ende'))
                        or (n >= states('input_datetime.heizung_spiel_we_start') and n < states('input_datetime.heizung_spiel_we_ende')) %}
            {% else %}
              {% set hyd = (n >= states('input_datetime.heizung_bad_morgens_start') and n < states('input_datetime.heizung_bad_morgens_ende'))
                        or (n >= states('input_datetime.heizung_bad_abends_start') and n < states('input_datetime.heizung_bad_abends_ende'))
                        or (n >= states('input_datetime.heizung_spiel_wt_start') and n < states('input_datetime.heizung_spiel_wt_ende')) %}
            {% endif %}
            {% set hyd_kw = hk_kw if hyd and not ventile_zu and not heiz_aus and is_state('binary_sensor.heizung_hydraulisch_bedarf', 'on') else 0.0 %}
            {% set ns.pv = 0.0 %}
            {% for p in fc %}
              {% set ps = as_datetime(p.period_start) %}
              {% if ps is not none %}
                {% if ps.tzinfo is none %}{% set ps = ps.replace(tzinfo=now().tzinfo) %}{% endif %}
                {% if ts >= ps and ts < ps + timedelta(minutes=30) %}{% set ns.pv = p.pv_estimate | float(0) %}{% endif %}
              {% endif %}
            {% endfor %}
            {% set ms = ts.timestamp() * 1000 %}
            {% set ns.socn = ns.soc %}
            {% for p in pts %}
              {% if p[0] <= ms %}{% set ns.socn = p[1] | float(0) %}{% endif %}
            {% endfor %}
            {% set bat_kw = (ns.socn - ns.soc) / 100.0 * 15.0 / dt_h %}
            {% set surplus = [ns.pv - haus_kw - ([bat_kw, 0] | max), 0] | max %}
