                  {% if ts >= ps and ts < ps + timedelta(minutes=30) %}{% set ns.pv = p.pv_estimate | float(0) %}{% endif %}
                {% endif %}
              {% endfor %}
              {% set ms = ts.timestamp() * 1000 %}
              {% set ns.socn = ns.soc %}
              {% for p in pts %}
                {% if p[0] <= ms %}{% set ns.socn = p[1] | float(0) %}{% endif %}
              {% endfor %}
              {% set bat_kw = (ns.socn - ns.soc) / 100.0 * 15.0 / dt_h %}
              {% set surplus = [ns.pv - haus_kw - ([bat_kw, 0] | max), 0] | max %}
              {% set cap = m * cp %}
              {% set q = (ww_kw + hyd_kw + 0.08) * dt_h * 1000.0 %}
              {% set d1 = [q / cap, ns.t1 - 20] | min %}{% set ns.t1 = ns.t1 - d1 %}{% set q = q - d1 * cap %}
              {% set d2 = [q / cap, ns.t2 - 20] | min %}{% set ns.t2 = ns.t2 - d2 %}{% set q = q - d2 * cap %}
              {% set d3 = [q / cap, ns.t3 - 20] | min %}{% set ns.t3 = ns.t3 - d3 %}
              {% set qe = (ww_kw + hyd_kw + 0.08) * dt_h * 1000.0 %}
              {% set de1 = [qe / cap, ns.e1 - 20] | min %}{% set ns.e1 = ns.e1 - de1 %}{% set qe = qe - de1 * cap %}
              {% set de2 = [qe / cap, ns.e2 - 20] | min %}{% set ns.e2 = ns.e2 - de2 %}{% set qe = qe - de2 * cap %}
              {% set de3 = [qe / cap, ns.e3 - 20] | min %}{% set ns.e3 = ns.e3 - de3 %}
              {% set elwa_ziel = states('input_number.heizung_elwa_ziel_c') | float(80) %}
              {% set elwa = [surplus, 3.5] | min if ns.e2 < elwa_ziel else 0.0 %}
              {% set dT = elwa * dt_h * 1000.0 / cap %}
              {% set ns.e2 = [ns.e2 + dT * 0.70, elwa_ziel] | min %}
              {% set ns.e1 = [ns.e1 + dT * 0.20, elwa_ziel] | min %}
              {% set ns.e3 = ns.e3 + dT * 0.10 %}
              {% set ns.ts = ns.ts + [(ts.timestamp() * 1000) | int] %}
              {% set ns.top_ohne = ns.top_ohne + [(ns.t1 * 10) | round(0) / 10] %}
              {% set ns.top_mit = ns.top_mit + [(ns.e1 * 10) | round(0) / 10] %}
              {% set ns.pvs = ns.pvs + [(ns.pv * 10) | round(0) / 10] %}
              {% set ns.sur = ns.sur + [(surplus * 10) | round(0) / 10] %}
              {% set ns.socs = ns.socs + [(ns.socn * 10) | round(0) / 10] %}
              {% set ns.soc = ns.socn %}
            {% endfor %}
            {{ {'ts': ns.ts, 'top_ohne': ns.top_ohne, 'top_mit': ns.top_mit, 'pv_kw': ns.pvs, 'surplus_kw': ns.sur, 'soc': ns.socs} | tojson }}
