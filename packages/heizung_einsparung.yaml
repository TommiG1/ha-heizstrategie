              + states('sensor.heizung_elwa_netz_kwh_monat') | float(0)) | round(2) }}
        pv_kwh: "{{ states('sensor.heizung_elwa_pv_kwh_monat') | float(0) | round(2) }}"
        akku_kwh: "{{ states('sensor.heizung_elwa_akku_kwh_monat') | float(0) | round(2) }}"
        netz_kwh: "{{ states('sensor.heizung_elwa_netz_kwh_monat') | float(0) | round(2) }}"
        pellet_wert_brutto_eur: >-
          {% set kg = states('sensor.heizung_einsparung_elwa_monat') | float(0) %}
          {% set preis_t = states('sensor.pelletpreis_bayern') | float(430) %}
          {{ (kg * preis_t / 1000) | round(2) }}
        stromkosten_eur: >-
          {% set pv = states('sensor.heizung_elwa_pv_kwh_monat') | float(0) %}
          {% set akku = states('sensor.heizung_elwa_akku_kwh_monat') | float(0) %}
          {% set netz = states('sensor.heizung_elwa_netz_kwh_monat') | float(0) %}
          {% set einspeise = states('input_number.heizung_einsparung_einspeiseverguetung_ct') | float(6.2) / 100 %}
          {% set netzpreis = states('sensor.electricity_price') | float(states('input_number.heizung_einsparung_netzpreis_ct') | float(22.75) / 100) %}
          {{ ((pv + akku) * einspeise + netz * netzpreis) | round(2) }}
        netto_ersparnis_eur: >-
          {% set kg = states('sensor.heizung_einsparung_elwa_monat') | float(0) %}
          {% set preis_t = states('sensor.pelletpreis_bayern') | float(430) %}
          {% set brutto = kg * preis_t / 1000 %}
          {% set pv = states('sensor.heizung_elwa_pv_kwh_monat') | float(0) %}
          {% set akku = states('sensor.heizung_elwa_akku_kwh_monat') | float(0) %}
          {% set netz = states('sensor.heizung_elwa_netz_kwh_monat') | float(0) %}
          {% set einspeise = states('input_number.heizung_einsparung_einspeiseverguetung_ct') | float(6.2) / 100 %}
          {% set netzpreis = states('sensor.electricity_price') | float(states('input_number.heizung_einsparung_netzpreis_ct') | float(22.75) / 100) %}
          {% set strom = (pv + akku) * einspeise + netz * netzpreis %}
          {{ (brutto - strom) | round(2) }}
        modelliert: "ELWA-Waerme = ELWA-Strom (COP 1)"

