  - sensor:
      - name: "Schimmel Lüftungsempfehlung"
        unique_id: schimmel_lueftungsempfehlung
        icon: mdi:weather-windy
        state: >
          {% set rooms = [
            ('Büro', 'sensor.schimmel_risiko_buero'),
            ('Wohnzimmer', 'sensor.schimmel_risiko_wohnen'),
            ('Schlafen C', 'sensor.schimmel_risiko_schlafen_c'),
            ('Schlafzimmer', 'sensor.schimmel_risiko_schlafzimmer'),
            ('Bad', 'sensor.schimmel_risiko_bad'),
            ('Spielzimmer', 'sensor.spielzimmer_spielzimmer_schimmelpilzrisiko'),
          ] %}
          {% set out_t = states('sensor.aussen_temperatur') | float(none) %}
          {% set out_dp = states('sensor.aussen_taupunkt') | float(none) %}
          {% set ns = namespace(risk=0, lueften=0, heizen=0, stoss=0) %}
          {% if out_dp is not none and out_t is not none %}
            {% for name, eid in rooms %}
              {% if states(eid) in ['Medium', 'High', 'Critical'] %}
                {% set ns.risk = ns.risk + 1 %}
                {% set in_dp = state_attr(eid, 'dew_point') | float(none) %}
                {% if in_dp is none %}
                  {% set ns.heizen = ns.heizen + 1 %}
                {% else %}
                  {% set delta = in_dp - out_dp %}
                  {% if delta >= 1.0 %}
                    {% if out_t < 5 %}
                      {% set ns.stoss = ns.stoss + 1 %}
                    {% else %}
                      {% set ns.lueften = ns.lueften + 1 %}
                    {% endif %}
                  {% elif delta >= 0.3 %}
                    {% if out_t < 12 %}
                      {% set ns.stoss = ns.stoss + 1 %}
                    {% else %}
                      {% set ns.lueften = ns.lueften + 1 %}
                    {% endif %}
                  {% else %}
                    {% set ns.heizen = ns.heizen + 1 %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {% if ns.risk == 0 %}
            Kein Risiko
          {% elif out_dp is none %}
            Unbekannt
          {% elif ns.lueften > 0 and ns.heizen == 0 and ns.stoss == 0 %}
            Lüften
          {% elif ns.stoss > 0 and ns.heizen == 0 and ns.lueften == 0 %}
            Stoßlüften + heizen
          {% elif ns.heizen > 0 and ns.lueften == 0 and ns.stoss == 0 %}
            Heizen
          {% elif (ns.lueften > 0 or ns.stoss > 0) and ns.heizen > 0 %}
            Gemischt
          {% elif ns.lueften > 0 and ns.stoss > 0 %}
            Stoßlüften
          {% else %}
            Heizen
          {% endif %}
        attributes:
          outdoor_temperature: "{{ states('sensor.aussen_temperatur') }}"
          outdoor_humidity: "{{ states('sensor.aussen_feuchtigkeit') }}"
          outdoor_dew_point: "{{ states('sensor.aussen_taupunkt') }}"
          summary: >
            {% set out_t = states('sensor.aussen_temperatur') | float(none) %}
            {% set out_rh = states('sensor.aussen_feuchtigkeit') | float(none) %}
            {% set out_dp = states('sensor.aussen_taupunkt') | float(none) %}
            {% if out_t is not none and out_rh is not none and out_dp is not none %}
              Außen {{ out_t | round(1) }} °C (ETA) · {{ out_rh | round(0) }} % (Terrasse) · Taupunkt {{ out_dp | round(1) }} °C
            {% else %}
              Außendaten nicht verfügbar
            {% endif %}
          detail: >
            {% set rooms = [
              ('Büro', 'sensor.schimmel_risiko_buero'),
              ('Wohnzimmer', 'sensor.schimmel_risiko_wohnen'),
              ('Schlafen C', 'sensor.schimmel_risiko_schlafen_c'),
              ('Schlafzimmer', 'sensor.schimmel_risiko_schlafzimmer'),
              ('Bad', 'sensor.schimmel_risiko_bad'),
              ('Spielzimmer', 'sensor.spielzimmer_spielzimmer_schimmelpilzrisiko'),
            ] %}
            {% set out_t = states('sensor.aussen_temperatur') | float(none) %}
            {% set out_dp = states('sensor.aussen_taupunkt') | float(none) %}
            {% set ns = namespace(risk=0, lines=[]) %}
            {% if out_dp is not none and out_t is not none %}
              {% for name, eid in rooms %}
                {% if states(eid) in ['Medium', 'High', 'Critical'] %}
                  {% set ns.risk = ns.risk + 1 %}
                  {% set in_dp = state_attr(eid, 'dew_point') | float(none) %}
                  {% if in_dp is not none %}
                    {% set delta = in_dp - out_dp %}
                    {% if delta >= 1.0 %}
                      {% if out_t < 5 %}
                        {% set ns.lines = ns.lines + [name ~ ': kurz stoßlüften, danach heizen'] %}
                      {% else %}
                        {% set ns.lines = ns.lines + [name ~ ': lüften (außen ' ~ (delta | round(1)) ~ ' °C trockener)'] %}
                      {% endif %}
                    {% elif delta >= 0.3 %}
                      {% if out_t < 12 %}
                        {% set ns.lines = ns.lines + [name ~ ': kurz stoßlüften, danach heizen'] %}
                      {% else %}
                        {% set ns.lines = ns.lines + [name ~ ': lüften (außen etwas trockener)'] %}
                      {% endif %}
                    {% else %}
                      {% set ns.lines = ns.lines + [name ~ ': nicht lüften — heizen'] %}
                    {% endif %}
                  {% else %}
                    {% set ns.lines = ns.lines + [name ~ ': Daten unvollständig — heizen'] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {% if ns.risk == 0 %}
              Kein erhöhtes Schimmelrisiko — kein Handeln nötig.
            {% elif out_dp is none %}
              Außendaten fehlen — Empfehlung nicht möglich.
            {% else %}
              {{ ns.lines | join(' · ') }}
            {% endif %}
          rooms_ventilate: >
            {% set rooms = [
              ('Büro', 'sensor.schimmel_risiko_buero'),
              ('Wohnzimmer', 'sensor.schimmel_risiko_wohnen'),
              ('Schlafen C', 'sensor.schimmel_risiko_schlafen_c'),
              ('Schlafzimmer', 'sensor.schimmel_risiko_schlafzimmer'),
              ('Bad', 'sensor.schimmel_risiko_bad'),
              ('Spielzimmer', 'sensor.spielzimmer_spielzimmer_schimmelpilzrisiko'),
            ] %}
            {% set out_t = states('sensor.aussen_temperatur') | float(none) %}
            {% set out_dp = states('sensor.aussen_taupunkt') | float(none) %}
            {% set ns = namespace(names=[]) %}
            {% if out_dp is not none and out_t is not none %}
              {% for name, eid in rooms %}
                {% if states(eid) in ['Medium', 'High', 'Critical'] %}
                  {% set in_dp = state_attr(eid, 'dew_point') | float(none) %}
                  {% if in_dp is not none %}
                    {% set delta = in_dp - out_dp %}
                    {% if delta >= 1.0 and out_t >= 5 %}
                      {% set ns.names = ns.names + [name] %}
                    {% elif delta >= 0.3 and out_t >= 12 %}
                      {% set ns.names = ns.names + [name] %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.names | join(', ') }}
          rooms_heat: >
            {% set rooms = [
              ('Büro', 'sensor.schimmel_risiko_buero'),
              ('Wohnzimmer', 'sensor.schimmel_risiko_wohnen'),
              ('Schlafen C', 'sensor.schimmel_risiko_schlafen_c'),
              ('Schlafzimmer', 'sensor.schimmel_risiko_schlafzimmer'),
              ('Bad', 'sensor.schimmel_risiko_bad'),
              ('Spielzimmer', 'sensor.spielzimmer_spielzimmer_schimmelpilzrisiko'),
            ] %}
            {% set out_t = states('sensor.aussen_temperatur') | float(none) %}
            {% set out_dp = states('sensor.aussen_taupunkt') | float(none) %}
            {% set ns = namespace(names=[]) %}
            {% if out_dp is not none and out_t is not none %}
              {% for name, eid in rooms %}
                {% if states(eid) in ['Medium', 'High', 'Critical'] %}
                  {% set in_dp = state_attr(eid, 'dew_point') | float(none) %}
                  {% if in_dp is none or (in_dp - out_dp) < 0.3 %}
                    {% set ns.names = ns.names + [name] %}
                  {% elif (in_dp - out_dp) >= 0.3 and out_t < 12 %}
                    {% set ns.names = ns.names + [name] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.names | join(', ') }}
