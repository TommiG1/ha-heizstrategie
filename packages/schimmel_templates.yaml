  - binary_sensor:
      # Schimmel-Heizen: nur 11–18 Uhr, nur wenn Schalter an,
      # Risiko Medium/High und Außenluft nicht trockener (→ Heizen statt Lüften).
      - name: Schimmel Heizen Fenster
        unique_id: schimmel_heizen_fenster
        default_entity_id: binary_sensor.schimmel_heizen_fenster
        icon: mdi:clock-outline
        state: >-
          {% set n = now().strftime('%H:%M:%S') %}
          {% set a = states('input_datetime.schimmel_heizen_start') %}
          {% set b = states('input_datetime.schimmel_heizen_ende') %}
          {{ a not in ['unknown', 'unavailable', ''] and b not in ['unknown', 'unavailable', ''] and n >= a and n < b }}

      - name: Schimmel Heizen aktiv Büro
        unique_id: schimmel_heizen_aktiv_buero
        default_entity_id: binary_sensor.schimmel_heizen_aktiv_buero
        icon: mdi:radiator
        state: >-
          {% set eid = 'sensor.schimmel_risiko_buero' %}
          {% set out_dp = states('sensor.aussen_taupunkt') | float(none) %}
          {% set in_dp = state_attr(eid, 'dew_point') | float(none) %}
          {{ is_state('input_boolean.schimmel_heizen_buero', 'on')
             and is_state('binary_sensor.schimmel_heizen_fenster', 'on')
             and states(eid) in ['Medium', 'High', 'Critical']
             and out_dp is not none and in_dp is not none
             and (in_dp - out_dp) < 0.3
             and is_state('binary_sensor.heizung_fenster_buero_roh', 'off') }}

      - name: Schimmel Heizen aktiv Wohnen
        unique_id: schimmel_heizen_aktiv_wohnen
        default_entity_id: binary_sensor.schimmel_heizen_aktiv_wohnen
        icon: mdi:radiator
        state: >-
          {% set eid = 'sensor.schimmel_risiko_wohnen' %}
          {% set out_dp = states('sensor.aussen_taupunkt') | float(none) %}
