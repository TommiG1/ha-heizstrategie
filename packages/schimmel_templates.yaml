# Mold templates (package)
# 1) Local risk sensors (temp/humidity → margin like tado)
# 2) Outdoor: see packages/aussen_wetter.yaml (ETA→Netatmo→DWD + Abgleich)
# 3) Mold-heat binary sensors (boost climate when outdoor air is not drier)
# 4) Ventilation advice aggregating room risks vs outdoor dew point
# See ENTITY_MAP.md for room climate/humidity and tado risk entities.

template:
  # Lokale Schimmelrisiko-Sensoren (schneller als tado Cloud).
  # Klassifikation wie tado_ce: Margin = Raumtemp − Taupunkt
  # Critical <3, High <5, Medium <7, sonst Low.
  - sensor:
      - name: Schimmelpilzrisiko Wohnzimmer
        unique_id: schimmel_risiko_wohnen_netatmo
        default_entity_id: sensor.schimmel_risiko_wohnen
        icon: mdi:mushroom
        availability: >-
          {{ states('sensor.wohnzimmer_temperatur_2') not in ['unknown', 'unavailable', '']
             and states('sensor.wohnzimmer_luftfeuchtigkeit_2') not in ['unknown', 'unavailable', ''] }}
        state: >-
          {% set t = states('sensor.wohnzimmer_temperatur_2') | float(none) %}
          {% set rh = states('sensor.wohnzimmer_luftfeuchtigkeit_2') | float(none) %}
          {% if t is none or rh is none or rh <= 0 %}
            unavailable
          {% else %}
            {% set gamma = (rh / 100) | log + (17.62 * t) / (243.12 + t) %}
            {% set dp = (243.12 * gamma) / (17.62 - gamma) %}
            {% set margin = t - dp %}
            {% if margin < 3 %}Critical{% elif margin < 5 %}High{% elif margin < 7 %}Medium{% else %}Low{% endif %}
          {% endif %}
        attributes:
          source: netatmo
          room_temperature: "{{ states('sensor.wohnzimmer_temperatur_2') | float(none) }}"
          humidity: "{{ states('sensor.wohnzimmer_luftfeuchtigkeit_2') | float(none) }}"
          dew_point: >-
            {% set t = states('sensor.wohnzimmer_temperatur_2') | float(none) %}
            {% set rh = states('sensor.wohnzimmer_luftfeuchtigkeit_2') | float(none) %}
            {% if t is none or rh is none or rh <= 0 %}
              None
            {% else %}
              {% set gamma = (rh / 100) | log + (17.62 * t) / (243.12 + t) %}
              {{ ((243.12 * gamma) / (17.62 - gamma)) | round(1) }}
            {% endif %}
          margin: >-
            {% set t = states('sensor.wohnzimmer_temperatur_2') | float(none) %}
            {% set rh = states('sensor.wohnzimmer_luftfeuchtigkeit_2') | float(none) %}
            {% if t is none or rh is none or rh <= 0 %}
              None
            {% else %}
              {% set gamma = (rh / 100) | log + (17.62 * t) / (243.12 + t) %}
              {% set dp = (243.12 * gamma) / (17.62 - gamma) %}
              {{ (t - dp) | round(1) }}
            {% endif %}

